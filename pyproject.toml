# --- 完全替換 [tool.poetry] 區塊 ---
[tool.poetry]
name = "prometheus-fire"
version = "0.9.0"
description = "Advanced Quantitative Research Framework"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "prometheus", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
typer = {extras = ["all"], version = "*"}
pandas = "^2.2.2"
numpy = "<2.0"
requests = "^2.32.3"
requests-cache = "^1.2.1"
fredapi = "^0.5.2"
yfinance = "^0.2.65"
duckdb = "^1.0.0"
plotly = "^5.22.0"
deap = "^1.4.1"
fastapi = {extras = ["all"], version = "^0.111.0"}
vectorbt = "^0.28.0"
aiosqlite = "^0.21.0"
rich = "^14.0.0"
psutil = "^5.9.5"
pybreaker = "^0.6.0"
uvicorn = "^0.22.0"
pyyaml = "^6.0.1"
openpyxl = "^3.1.5"
pandas-ta = "^0.3.14b0"
setuptools = "^80.9.0"
gunicorn = "^23.0.0"
matplotlib = "^3.10.3"
pandas-datareader = "^0.10.0"
backtrader = "^1.9.78.123"
python-json-logger = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
httpx = "^0.27.0"
psutil = "^5.9.5"
pandas = "^2.2.2"
matplotlib = "^3.9.0"
ruff = "^0.5.0"
deptry = "^0.17.0"
pytest-timeout = "^2.3.1"

[tool.ruff]
line-length = 120
exclude = ["start_colab.py"]

[tool.ruff.lint]
# 啟用 Pyflakes (F), pycodestyle (E, W), isort (I) 等核心規則
select = ["E", "W", "F", "I"]
ignore = ["E501", "E402", "I001"]

[tool.deptry]
# 將 src 目錄下的 prometheus 模組標記為第一方本地模組
known_first_party = ["prometheus"]
# 針對不同規則忽略特定的包或模組
[tool.deptry.per_rule_ignores]
# DEP001: 忽略 'apps' 模組的導入，因為它可能是一個動態的命名空間
DEP001 = ["apps", "google", "pyngrok", "IPython"]
# DEP002: 忽略這些未使用的依賴，它們可能是間接使用或部署時需要
DEP002 = ["vectorbt", "pybreaker", "openpyxl", "pandas-ta", "setuptools", "gunicorn", "uvicorn", "fredapi", "psutil", "matplotlib"]
# DEP003: 忽略對這些傳遞性依賴的直接導入
DEP003 = ["click", "pydantic", "pytz", "IPython"]
# DEP004: 忽略在測試代碼中導入 'pytest'
DEP004 = ["pytest"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
