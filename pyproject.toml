# --- 完全替換 [tool.poetry] 區塊 ---
[tool.poetry]
name = "prometheus-fire"
version = "0.9.0"
description = "Advanced Quantitative Research Framework"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "prometheus", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
typer = {extras = ["all"], version = "*"}
pandas = "^2.2.2"
numpy = "<2.0"
requests = "^2.32.3"
requests-cache = "^1.2.1"
fredapi = "^0.5.2"
yfinance = "^0.2.65"
duckdb = "^1.0.0"
plotly = "^5.22.0"
deap = "^1.4.1"
fastapi = {extras = ["all"], version = "^0.111.0"}
vectorbt = "^0.28.0"
aiosqlite = "^0.21.0"
rich = "^14.0.0"
psutil = "^5.9.5"
pybreaker = "^0.6.0"
uvicorn = "^0.22.0"
pyyaml = "^6.0.1"
openpyxl = "^3.1.5"
pandas-ta = "^0.3.14b0"
setuptools = "^80.9.0"
playwright = "^1.53.0"
gunicorn = "^23.0.0"
matplotlib = "^3.10.3"
pandas-datareader = "^0.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
ruff = "^0.4.8"
deptry = "^0.17.0"
pytest-timeout = "^2.3.1"


# --- 如果不存在則新增，如果存在則更新 [tool.ruff] 和 [tool.ruff.lint] ---
playwright = "^1.53.0"
[tool.ruff]
line-length = 88
# 告知 Ruff 我們的原始碼目錄
src = ["src", "tests"]

[tool.ruff.lint]
# 我們只選擇會導致執行失敗的規則類別
# E: Pyflakes (語法錯誤)
# F: Pyflakes (邏輯錯誤，如未定義變數)
select = ["E", "F"]

# 我們明確忽略所有與風格相關的規則
# W: Pycodestyle (警告)
# D: Pydocstyle (文件字串)
# I: isort (導入排序)
# E402: Module level import not at top of file
# E701: Multiple statements on one line (colon)
ignore = ["W", "D", "I", "E402", "E701", "E501"]

[tool.deptry]
# 將 src 目錄下的 prometheus 模組標記為第一方本地模組
known_first_party = ["prometheus"]
# 針對不同規則忽略特定的包或模組
[tool.deptry.per_rule_ignores]
# DEP001: 忽略 'apps' 模組的導入，因為它可能是一個動態的命名空間
DEP001 = ["apps"]
# DEP002: 忽略這些未使用的依賴，它們可能是間接使用或部署時需要
DEP002 = ["vectorbt", "pybreaker", "openpyxl", "pandas-ta", "setuptools", "gunicorn"]
# DEP003: 忽略對這些傳遞性依賴的直接導入
DEP003 = ["click", "pydantic", "pytz"]
# DEP004: 忽略在測試代碼中導入 'pytest'
DEP004 = ["pytest"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
