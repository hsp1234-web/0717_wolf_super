<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作戰指揮中心 v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-2xl space-y-6">
        <h1 class="text-3xl font-bold text-center text-cyan-400">普羅米修斯 - 作戰指揮中心</h1>
        <div class="border-t border-gray-700 pt-6 text-center">
            <button id="execute-task-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded-lg transition-all duration-300 ease-in-out disabled:bg-gray-500 disabled:cursor-not-allowed">
                執行深度分析
            </button>
            <div id="task-status-message" class="mt-4 text-sm text-gray-400 h-5">請下達指令</div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const executeBtn = document.getElementById('execute-task-btn');
            const statusMsgElem = document.getElementById('task-status-message');
            let pollingInterval = null;

            function stopPolling() {
                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = null;
            }

            async function checkTaskStatus(taskId) {
                try {
                    const response = await fetch(`/api/v1/task_status/${taskId}`);
                    if (!response.ok) throw new Error('無法查詢任務狀態');
                    const data = await response.json();
                    statusMsgElem.textContent = `任務狀態: ${data.status}...`;
                    if (data.status === 'completed' || data.status === 'failed') {
                        stopPolling();
                        statusMsgElem.textContent = `任務結果: ${data.result}`;
                        statusMsgElem.classList.remove('text-amber-400');
                        statusMsgElem.classList.add(data.status === 'completed' ? 'text-green-400' : 'text-red-500');
                        executeBtn.disabled = false;
                    }
                } catch (error) {
                    statusMsgElem.textContent = '與後端通訊中斷';
                    stopPolling();
                    executeBtn.disabled = false;
                }
            }

            executeBtn.addEventListener('click', async () => {
                executeBtn.disabled = true;
                stopPolling();
                statusMsgElem.textContent = '指令已發送，正在提交任務...';
                statusMsgElem.className = 'mt-4 text-sm text-amber-400 h-5';

                try {
                    const response = await fetch('/api/v1/submit_task', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_type: 'deep_analysis' }) // <-- 關鍵升級
                    });
                    if (!response.ok) throw new Error('任務提交失敗');
                    const result = await response.json();
                    statusMsgElem.textContent = `任務已提交 (ID: ...${result.task_id.slice(-6)})，開始追蹤...`;
                    pollingInterval = setInterval(() => checkTaskStatus(result.task_id), 2000);
                } catch (error) {
                    statusMsgElem.textContent = '錯誤：提交任務失敗';
                    executeBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
