<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作戰指揮中心 v2.3 - 神經中樞</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans">
    <div class="container mx-auto p-4 md:p-8">
        <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-4xl mx-auto space-y-8">
            <h1 class="text-3xl font-bold text-center text-cyan-400">普羅米修斯 - 作戰指揮中心</h1>

            <!-- 系統資源監控 -->
            <div class="border-t border-gray-700 pt-6">
                <h2 class="text-xl font-semibold text-center text-gray-300 mb-4">即時系統資源監控</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-gray-700/50 p-4 rounded-lg">
                        <h3 class="font-semibold text-center text-gray-400">CPU 使用率</h3>
                        <div class="w-full bg-gray-600 rounded-full h-2.5 mt-2">
                            <div id="cpu-progress" class="bg-blue-500 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                        <p id="cpu-text" class="text-center font-mono mt-1">0.0%</p>
                    </div>
                    <div class="bg-gray-700/50 p-4 rounded-lg">
                        <h3 class="font-semibold text-center text-gray-400">記憶體使用率</h3>
                        <div class="w-full bg-gray-600 rounded-full h-2.5 mt-2">
                            <div id="mem-progress" class="bg-green-500 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                        <p id="mem-text" class="text-center font-mono mt-1">0.0%</p>
                    </div>
                </div>
            </div>

            <!-- 指令下達區域 -->
            <div class="border-t border-gray-700 pt-6 text-center">
                <button id="execute-task-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded-lg">執行深度分析</button>
                <div id="task-status-message" class="mt-4 text-sm text-gray-400 h-5">請下達指令</div>
            </div>

            <!-- 歷史任務面板 -->
            <div class="border-t border-gray-700 pt-6">
                <h2 class="text-xl font-semibold text-center text-gray-300 mb-4">近期作戰紀錄</h2>
                <div class="overflow-x-auto"><table class="min-w-full text-sm text-left"><thead class="bg-gray-700/50"><tr><th class="p-2">時間</th><th class="p-2">類型</th><th class="p-2">狀態</th><th class="p-2">結果</th></tr></thead><tbody id="task-history-body"></tbody></table></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ... (既有的任務相關元素和函式) ...
            const executeBtn = document.getElementById('execute-task-btn');
            const statusMsgElem = document.getElementById('task-status-message');
            const historyBody = document.getElementById('task-history-body');
            let taskPollingInterval = null;

            // --- 新增的系統監控元素 ---
            const cpuProgress = document.getElementById('cpu-progress');
            const cpuText = document.getElementById('cpu-text');
            const memProgress = document.getElementById('mem-progress');
            const memText = document.getElementById('mem-text');

            // --- 新增的系統監控函式 ---
            async function fetchSystemMetrics() {
                try {
                    const response = await fetch('/api/v1/get_system_metrics');
                    const metrics = await response.json();
                    cpuProgress.style.width = `${metrics.cpu_percent}%`;
                    cpuText.textContent = `${metrics.cpu_percent.toFixed(1)}%`;
                    memProgress.style.width = `${metrics.memory_percent}%`;
                    memText.textContent = `${metrics.memory_percent.toFixed(1)}%`;
                } catch (error) {
                    console.error('無法獲取系統指標:', error);
                }
            }

            // ... (既有的任務相關函式) ...
            async function fetchTaskHistory() { /* ... 保持不變 ... */ }
            function stopTaskPolling() { /* ... 保持不變 ... */ }
            async function checkTaskStatus(taskId) { /* ... 保持不變 ... */ }
            executeBtn.addEventListener('click', async () => {
                executeBtn.disabled = true;
                statusMsgElem.textContent = '指令已下達，等待執行...';
                if (taskPollingInterval) clearInterval(taskPollingInterval);

                try {
                    const response = await fetch('/api/v1/submit_task', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_type: 'stress_index_analysis' })
                    });
                    const data = await response.json();

                    if (data.task_id) {
                        statusMsgElem.textContent = `任務 ${data.task_id.substring(0, 8)}... 正在執行中。`;
                        taskPollingInterval = setInterval(() => checkTaskStatus(data.task_id), 1000);
                    } else {
                        statusMsgElem.textContent = '任務提交失敗。';
                        executeBtn.disabled = false;
                    }
                } catch (error) {
                    statusMsgElem.textContent = '錯誤：無法與伺服器通訊。';
                    executeBtn.disabled = false;
                }
            });

            async function checkTaskStatus(taskId) {
                try {
                    const response = await fetch(`/api/v1/task_status/${taskId}`);
                    const data = await response.json();

                    if (data.status === 'completed' || data.status === 'failed') {
                        stopTaskPolling();
                        statusMsgElem.textContent = `任務結果: ${data.result}`;
                        executeBtn.disabled = false;
                        fetchTaskHistory(); // 更新歷史紀錄
                    } else {
                        statusMsgElem.textContent = `任務 ${data.task_id.substring(0, 8)}... 狀態: ${data.status}`;
                    }
                } catch (error) {
                    stopTaskPolling();
                    statusMsgElem.textContent = '輪詢任務狀態時發生錯誤。';
                    executeBtn.disabled = false;
                }
            }

            function stopTaskPolling() {
                if (taskPollingInterval) {
                    clearInterval(taskPollingInterval);
                    taskPollingInterval = null;
                }
            }

            // --- 啟動所有輪詢 ---
            fetchTaskHistory();
            fetchSystemMetrics();
            setInterval(fetchTaskHistory, 15000);
            setInterval(fetchSystemMetrics, 3000); // 每 3 秒刷新一次系統指標
        });
    </script>
</body>
</html>
