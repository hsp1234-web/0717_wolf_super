<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作戰指揮中心 v2.4 - 九頭蛇</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans">
    <div class="container mx-auto p-4 md:p-8">
        <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-4xl mx-auto space-y-8">
            <h1 class="text-3xl font-bold text-center text-cyan-400">普羅米修斯 - 作戰指揮中心</h1>

            <!-- 指令下達區域 -->
            <div class="border-t border-gray-700 pt-6 text-center space-x-4">
                <button id="stress-index-btn" class="task-btn bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded-lg">計算市場壓力指數</button>
                <button id="correlation-btn" class="task-btn bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg">分析因子相關性</button>
            </div>
            <div id="task-status-message" class="mt-4 text-sm text-center text-gray-400 h-5">請下達指令</div>

            <!-- ... (歷史任務與系統資源面板保持不變) ... -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stressBtn = document.getElementById('stress-index-btn');
            const correlationBtn = document.getElementById('correlation-btn');
            const allButtons = [stressBtn, correlationBtn];
            const statusMsgElem = document.getElementById('task-status-message');
            let pollingInterval = null;

            function stopPolling() {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }

            async function checkTaskStatus(taskId) {
                try {
                    const response = await fetch(`/api/v1/task_status/${taskId}`);
                    if (!response.ok) {
                        stopPolling();
                        statusMsgElem.textContent = '錯誤：追蹤任務失敗';
                        allButtons.forEach(btn => btn.disabled = false);
                        return;
                    }
                    const data = await response.json();
                    if (data.status === 'completed' || data.status === 'failed') {
                        stopPolling();
                        // 修正：從 data.result 讀取結果
                        statusMsgElem.textContent = `任務結果: ${data.result}`;
                        statusMsgElem.className = data.status === 'completed'
                            ? 'mt-4 text-sm text-center text-green-400 h-5'
                            : 'mt-4 text-sm text-center text-red-400 h-5';
                        allButtons.forEach(btn => btn.disabled = false);
                    } else {
                        statusMsgElem.textContent = `任務正在執行... (狀態: ${data.status})`;
                    }
                } catch (error) {
                    stopPolling();
                    statusMsgElem.textContent = '錯誤：無法獲取任務狀態';
                    allButtons.forEach(btn => btn.disabled = false);
                }
            }

            async function submitTask(taskType) {
                allButtons.forEach(btn => btn.disabled = true);
                stopPolling();
                statusMsgElem.textContent = '指令已發送，正在提交任務...';
                statusMsgElem.className = 'mt-4 text-sm text-center text-amber-400 h-5';

                try {
                    const response = await fetch('/api/v1/submit_task', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        // 修正：根據後端 Pydantic 模型，補上 payload 欄位
                        body: JSON.stringify({ task_type: taskType, payload: {} })
                    });
                    const result = await response.json();
                    if (response.ok) {
                        statusMsgElem.textContent = `任務已提交 (ID: ...${result.task_id.slice(-6)})，開始追蹤...`;
                        pollingInterval = setInterval(() => checkTaskStatus(result.task_id), 2000);
                    } else {
                        statusMsgElem.textContent = `錯誤：提交任務失敗 - ${result.detail || '未知錯誤'}`;
                        allButtons.forEach(btn => btn.disabled = false);
                    }
                } catch (error) {
                    statusMsgElem.textContent = '錯誤：提交任務失敗';
                    allButtons.forEach(btn => btn.disabled = false);
                }
            }

            stressBtn.addEventListener('click', () => submitTask('stress_index_analysis'));
            correlationBtn.addEventListener('click', () => submitTask('factor_correlation_analysis'));

            // ... (所有輪詢啟動邏輯保持不變) ...
        });
    </script>
</body>
</html>
