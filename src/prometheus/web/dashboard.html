<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作戰指揮中心 v2.2 - 神之眼</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans">
    <div class="container mx-auto p-4 md:p-8">
        <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-4xl mx-auto space-y-8">
            <h1 class="text-3xl font-bold text-center text-cyan-400">普羅米修斯 - 作戰指揮中心</h1>

            <!-- 指令下達區域 -->
            <div class="border-t border-gray-700 pt-6 text-center">
                <button id="execute-task-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded-lg transition-all duration-300 ease-in-out disabled:bg-gray-500 disabled:cursor-not-allowed">
                    執行深度分析
                </button>
                <div id="task-status-message" class="mt-4 text-sm text-gray-400 h-5">請下達指令</div>
            </div>

            <!-- 歷史任務面板 -->
            <div class="border-t border-gray-700 pt-6">
                <h2 class="text-xl font-semibold text-center text-gray-300 mb-4">近期作戰紀錄</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm text-left">
                        <thead class="bg-gray-700/50">
                            <tr>
                                <th class="p-2">任務時間</th>
                                <th class="p-2">任務類型</th>
                                <th class="p-2">狀態</th>
                                <th class="p-2">結果摘要</th>
                            </tr>
                        </thead>
                        <tbody id="task-history-body">
                            <!-- 歷史紀錄將動態插入此處 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const executeBtn = document.getElementById('execute-task-btn');
            const statusMsgElem = document.getElementById('task-status-message');
            const historyBody = document.getElementById('task-history-body');
            let pollingInterval = null;

            const statusClasses = {
                completed: 'text-green-400',
                failed: 'text-red-500',
                running: 'text-yellow-400',
                pending: 'text-gray-400'
            };

            async function fetchTaskHistory() {
                try {
                    const response = await fetch('/api/v1/get_task_history');
                    const tasks = await response.json();
                    historyBody.innerHTML = ''; // 清空舊紀錄
                    tasks.forEach(task => {
                        const row = document.createElement('tr');
                        row.className = 'border-b border-gray-700 hover:bg-gray-700/30';
                        const statusClass = statusClasses[task.status] || 'text-gray-400';
                        row.innerHTML = `
                            <td class="p-2 font-mono text-xs">${new Date(task.created_at).toLocaleString()}</td>
                            <td class="p-2">${task.task_type}</td>
                            <td class="p-2 font-semibold ${statusClass}">${task.status}</td>
                            <td class="p-2 truncate" title="${task.result || ''}">${(task.result || 'N/A').substring(0, 50)}</td>
                        `;
                        historyBody.appendChild(row);
                    });
                } catch (error) {
                    console.error('無法獲取任務歷史:', error);
                }
            }

            function stopPolling() {
                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = null;
            }

            async function checkTaskStatus(taskId) {
                try {
                    const response = await fetch(`/api/v1/task_status/${taskId}`);
                    const data = await response.json();
                    statusMsgElem.textContent = `任務狀態: ${data.status}...`;
                    if (data.status === 'completed' || data.status === 'failed') {
                        stopPolling();
                        statusMsgElem.textContent = `任務結果: ${data.result}`;
                        executeBtn.disabled = false;
                        fetchTaskHistory(); // 任務完成後刷新歷史紀錄
                    }
                } catch (error) {
                    statusMsgElem.textContent = '與後端通訊中斷';
                    stopPolling();
                    executeBtn.disabled = false;
                }
            }

            executeBtn.addEventListener('click', async () => {
                executeBtn.disabled = true;
                stopPolling();
                statusMsgElem.textContent = '指令已發送，正在提交任務...';
                try {
                    const response = await fetch('/api/v1/submit_task', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_type: 'deep_analysis' })
                    });
                    const result = await response.json();
                    statusMsgElem.textContent = `任務已提交 (ID: ...${result.task_id.slice(-6)})，開始追蹤...`;
                    fetchTaskHistory(); // 提交後立即刷新一次
                    pollingInterval = setInterval(() => checkTaskStatus(result.task_id), 2000);
                } catch (error) {
                    statusMsgElem.textContent = '錯誤：提交任務失敗';
                    executeBtn.disabled = false;
                }
            });

            // 頁面載入時和之後每 15 秒刷新一次歷史紀錄
            fetchTaskHistory();
            setInterval(fetchTaskHistory, 15000);
        });
    </script>
</body>
</html>
