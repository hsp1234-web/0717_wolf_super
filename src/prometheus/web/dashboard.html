<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作戰指揮中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-cyan-400 mb-6">普羅米修斯 - 作戰指揮中心</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
            <div class="bg-gray-700/50 p-4 rounded-lg">
                <h2 class="text-lg font-semibold text-gray-400">系統壓力指數</h2>
                <p id="stress-index" class="text-4xl font-mono font-bold text-amber-400">讀取中...</p>
            </div>
            <div class="bg-gray-700/50 p-4 rounded-lg">
                <h2 class="text-lg font-semibold text-gray-400">現役策略數量</h2>
                <p id="active-strategies" class="text-4xl font-mono font-bold text-green-400">讀取中...</p>
            </div>
        </div>
        <div class="mt-6 flex items-center justify-center">
            <div id="status-light" class="w-4 h-4 rounded-full bg-yellow-500 animate-pulse"></div>
            <p id="status-text" class="ml-3 text-gray-400">正在連接至後端...</p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stressIndexElem = document.getElementById('stress-index');
            const activeStrategiesElem = document.getElementById('active-strategies');
            const statusLightElem = document.getElementById('status-light');
            const statusTextElem = document.getElementById('status-text');
            async function fetchSystemStatus() {
                try {
                    const response = await fetch('/api/v1/system_status');
                    if (!response.ok) throw new Error(`HTTP 錯誤！狀態: ${response.status}`);
                    const data = await response.json();
                    stressIndexElem.textContent = data.stress_index;
                    activeStrategiesElem.textContent = data.active_strategies;
                    statusLightElem.classList.remove('bg-yellow-500', 'animate-pulse', 'bg-red-500');
                    statusLightElem.classList.add('bg-green-500');
                    statusTextElem.textContent = '已連接，數據同步正常';
                } catch (error) {
                    console.error('無法獲取系統狀態:', error);
                    stressIndexElem.textContent = 'N/A';
                    activeStrategiesElem.textContent = 'N/A';
                    statusLightElem.classList.remove('bg-yellow-500', 'animate-pulse', 'bg-green-500');
                    statusLightElem.classList.add('bg-red-500');
                    statusTextElem.textContent = '與後端通訊中斷';
                }
            }
            fetchSystemStatus();
            setInterval(fetchSystemStatus, 5000);
        });
    </script>
</body>
</html>
